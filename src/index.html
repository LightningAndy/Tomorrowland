<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tomorrowland 2026 · Lineup Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- LOGIN SCREEN — visible by default -->
  <div id="loginScreen" style="display:flex; position:fixed; inset:0; align-items:center; justify-content:center; z-index:10;">
    <div class="login-bg">
      <div class="login-particles" id="particles"></div>
    </div>
    <div class="login-card">
      <div class="login-logo">
        <div class="logo-mark">TL</div>
        <div class="logo-text">
          <span class="logo-main">TOMORROWLAND</span>
          <span class="logo-sub">LINEUP TRACKER · 2026</span>
        </div>
      </div>
      <div class="login-form">
        <div class="field-group">
          <label>Username</label>
          <input type="text" id="usernameInput" placeholder="Enter your username" autocomplete="username">
        </div>
        <div class="field-group">
          <label>Password</label>
          <input type="password" id="passwordInput" placeholder="••••••••" autocomplete="current-password">
        </div>
        <div class="login-error" id="loginError">Invalid username or password</div>
        <button class="btn-login" id="loginBtn" onclick="handleLogin()">Enter the Festival</button>
      </div>
      <p class="login-footer">Boom, Belgium · 18–20 July 2026</p>
    </div>
  </div>

  <!-- MAIN APP — hidden by default -->
  <div id="appScreen" style="display:none; position:fixed; inset:0; overflow-y:auto;">
    <header class="app-header">
      <div class="header-left">
        <div class="logo-mark small">TL</div>
        <div>
          <div class="app-title">TOMORROWLAND 2026</div>
          <div class="app-subtitle">Lineup Tracker</div>
        </div>
      </div>
      <div class="header-right">
        <div class="user-pill">
          <span class="user-avatar" id="userAvatar"></span>
          <span id="currentUserDisplay"></span>
        </div>
        <button class="btn-icon" onclick="handleLogout()" title="Log out">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16,17 21,12 16,7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </header>

    <div class="app-body">
      <div class="tabs-bar">
        <button class="tab-btn active" onclick="showTab('rate', this)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/></svg>
          Rate Artists
        </button>
        <button class="tab-btn" onclick="showTab('priority', this)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
          Priority List
        </button>
        <button class="tab-btn" onclick="showTab('conflicts', this)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          Conflicts
          <span class="conflict-badge" id="conflictBadge" style="display:none">0</span>
        </button>
      </div>

      <div class="day-filters">
        <span class="filter-label">Day:</span>
        <button class="day-btn active" onclick="filterDay('all', this)">All</button>
        <button class="day-btn" onclick="filterDay('1', this)">Friday 18 Jul</button>
        <button class="day-btn" onclick="filterDay('2', this)">Saturday 19 Jul</button>
        <button class="day-btn" onclick="filterDay('3', this)">Sunday 20 Jul</button>
      </div>

      <div id="tab-rate" class="tab-content active">
        <div class="artist-list" id="artistList"></div>
      </div>

      <div id="tab-priority" class="tab-content">
        <div class="priority-header">
          <p class="priority-intro">Combined priority based on both ratings. Higher average score = must see.</p>
        </div>
        <div class="priority-list" id="priorityList"></div>
      </div>

      <div id="tab-conflicts" class="tab-content">
        <div class="priority-header">
          <p class="priority-intro">Artists where one person rated 5 stars and the other chose "Not for me".</p>
        </div>
        <div class="conflicts-list" id="conflictsList"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html><!-- cache bust -->
